name: Build AERIS Desktop for Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "plugin/**"
      - "licenses/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main, material-3, feature/native-player-and-remote-control, feature/standalone-lan-uploader-v2]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "plugin/**"
      - "licenses/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: aeris-desktop-windows-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout AERIS
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NASM for native decoder builds
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm --no-progress -y
          }
          nasm -v

      - name: Test AERIS Desktop
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Validate Android plugin
        shell: pwsh
        run: |
          python -m py_compile ../plugin/aeris.py
          $sourceBlob = git rev-parse HEAD:plugin/aeris.py
          $packageBlob = git rev-parse HEAD:plugin/aeris.plugin
          if ($sourceBlob -ne $packageBlob) {
            throw "plugin/aeris.py and plugin/aeris.plugin differ in the Git commit."
          }

      - name: Build AERIS Desktop
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare portable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\AERIS-Desktop"
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\aeris-desktop.exe" $stage
          @"
          AERIS Desktop 1.0.0

          Run aeris-desktop.exe. AERIS uses its integrated native media pipeline:
          audio output and video decoding are handled inside the application.
          No mpv.exe or separate player window is required.

          The Android plugin pairs once using the six-character code. A
          device token is then stored on this PC and reused for later sessions.
          Playback controls remain on the paired phone.
          A browser uploader is available at http://<PC-LAN-IP>:45873.

          AERIS uses an unencrypted WebSocket connection on the private LAN.
          Use only a trusted home network. Do not expose ports 45872 or 45873 to the internet.

          Media backend: alhazen-core (Apache-2.0); see upstream NOTICE:
          https://github.com/alhazen-rs/alhazen-core
          "@ | Set-Content -Encoding UTF8 "$stage\README.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/alhazen-rs/alhazen-core/master/NOTICE" -OutFile "$stage\licenses\ALHAZEN-NOTICE.txt"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/alhazen-rs/alhazen-core/master/LICENSE" -OutFile "$stage\licenses\ALHAZEN-LICENSE.txt"
          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\AERIS-Desktop-windows-x64-1.0.0.zip" -Force

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AERIS-Desktop-windows-x64-1.0.0
          path: dist/AERIS-Desktop-windows-x64-1.0.0.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: AERIS 1.0.0
          generate_release_notes: true
          files: dist/AERIS-Desktop-windows-x64-1.0.0.zip
