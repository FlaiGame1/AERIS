name: Build AERIS Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "licenses/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: aeris-desktop-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout AERIS
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build AERIS Desktop
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare portable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\AERIS-Desktop"
          New-Item -ItemType Directory -Force "$stage\mpv", "$stage\licenses" | Out-Null

          Copy-Item "target\x86_64-pc-windows-msvc\release\aeris-desktop.exe" $stage
          Copy-Item "..\licenses\OPENCHROMECAST-MIT.txt" "$stage\licenses\OPENCHROMECAST-MIT.txt"

          winget install --id mpv-player.mpv-CI.MSVC --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          $mpvExe = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter mpv.exe -ErrorAction Stop | Select-Object -First 1
          if (-not $mpvExe) { throw "mpv.exe was not found after installation" }
          Get-ChildItem $mpvExe.DirectoryName -File | Where-Object { $_.Name -ne "mpv.pdb" } | Copy-Item -Destination "$stage\mpv"

          @"
          AERIS Desktop development package

          Run aeris-desktop.exe. Keep the mpv folder beside it.
          This early prototype still uses the legacy experimental Cast V2 backend.
          It is not yet the final AERIS Protocol implementation.

          Third-party component:
          OpenChromecast-derived code — MIT License.
          License text: licenses/OPENCHROMECAST-MIT.txt

          MPV is distributed as a separate component with its own license files.
          "@ | Set-Content -Encoding UTF8 "$stage\THIRD-PARTY-NOTICES.txt"

          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\AERIS-Desktop-windows-x64.zip" -Force

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AERIS-Desktop-windows-x64
          path: dist/AERIS-Desktop-windows-x64.zip
          if-no-files-found: error
