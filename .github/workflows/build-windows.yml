name: Build AERIS Desktop for Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "plugin/**"
      - "licenses/**"
      - ".github/workflows/build-windows.yml"
  push:
    branches: [main, feature/native-player-and-remote-control]
    paths:
      - "desktop/**"
      - "protocol/**"
      - "plugin/**"
      - "licenses/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: aeris-desktop-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout AERIS
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Android plugin
        run: |
          python -m py_compile ../plugin/aeris.py
          python -c "from pathlib import Path; assert Path('../plugin/aeris.py').read_bytes() == Path('../plugin/aeris.plugin').read_bytes(), 'plugin package is out of sync'"

      - name: Download mpv runtime
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip --no-progress -y
          }
          $release = Invoke-RestMethod -Headers @{ "User-Agent" = "AERIS-Build" } -Uri "https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { throw "Could not find the x86_64 mpv runtime asset." }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extract = Join-Path $env:RUNNER_TEMP "aeris-mpv"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          New-Item -ItemType Directory -Force $extract | Out-Null
          7z x $archive "-o$extract" -y | Out-Null
          $mpvExe = Get-ChildItem -Path $extract -Filter "mpv.exe" -Recurse | Select-Object -First 1
          if (-not $mpvExe) { throw "mpv.exe was not found in the downloaded archive." }
          $stageMpv = Join-Path $env:GITHUB_WORKSPACE "dist\AERIS-Desktop\mpv"
          New-Item -ItemType Directory -Force $stageMpv | Out-Null
          Copy-Item -Path (Join-Path $mpvExe.Directory.FullName "*") -Destination $stageMpv -Recurse -Force
          "MPV_SOURCE=$($release.html_url)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MPV_ASSET=$($asset.name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build AERIS Desktop
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare portable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\AERIS-Desktop"
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\licenses\MPV-RUNTIME-NOTICE.txt" "$stage\licenses" -Force
          Copy-Item "target\x86_64-pc-windows-msvc\release\aeris-desktop.exe" $stage
          @"
          AERIS Desktop 0.5.1 preview

          Run aeris-desktop.exe. The first media transfer starts the bundled
          mpv playback engine. Audio and video playback are handled by mpv.
          Keep the mpv folder next to aeris-desktop.exe.

          The Android plugin pairs once using the six-character code. A
          device token is then stored on this PC and reused for later sessions.
          The phone can play, pause, resume, stop, seek, change volume and request playback status.

          AERIS uses an unencrypted WebSocket connection on the private LAN.
          Use only a trusted home network. Do not expose port 45872 to the internet.

          Third-party runtime:
          mpv source: $env:MPV_SOURCE
          Runtime archive: $env:MPV_ASSET
          See the included mpv license files and upstream license notices.
          "@ | Set-Content -Encoding UTF8 "$stage\README.txt"

          $licenseCandidates = Get-ChildItem -Path "$stage\mpv" -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|COPYING\.GPL|COPYING\.LGPL|README)$' }
          foreach ($license in $licenseCandidates) {
            $destination = Join-Path "$stage\licenses" ("mpv-" + $license.Name)
            Copy-Item $license.FullName $destination -Force
          }

          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\AERIS-Desktop-windows-x64.zip" -Force

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AERIS-Desktop-windows-x64
          path: dist/AERIS-Desktop-windows-x64.zip
          if-no-files-found: error
