name: Build AERIS Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/**"]
    paths:
      - "desktop/**"
      - "licenses/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

concurrency:
  group: aeris-desktop-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout AERIS
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build AERIS Desktop
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare portable package
        shell: pwsh
        run: |
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist\AERIS-Desktop"
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null

          Copy-Item "target\x86_64-pc-windows-msvc\release\aeris-desktop.exe" $stage

          @"
          AERIS Desktop development package

          Run aeris-desktop.exe. This build starts the AERIS Protocol v1
          WebSocket receiver on the private LAN interface at TCP port 45872.

          This is an early development build. Media playback, encrypted
          transport and persistent device pairing are not implemented yet.
          "@ | Set-Content -Encoding UTF8 "$stage\README.txt"

          Compress-Archive -Path "$stage\*" -DestinationPath "$env:GITHUB_WORKSPACE\dist\AERIS-Desktop-windows-x64.zip" -Force

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AERIS-Desktop-windows-x64
          path: dist/AERIS-Desktop-windows-x64.zip
          if-no-files-found: error
